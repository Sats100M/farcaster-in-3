<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>farcaster-in-3</title>
<style>
  :root {
    --bg: #fff; --card: #fff; --alt: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea;
    --accent: #0071e3; --like: #e0245e; --recast: #1d8f3a; --bad: #c9252d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #000; --alt: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --line: #2c2c2e; --accent: #2997ff; --like: #ff375f; --recast: #30d158; --bad: #ff453a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .wrap { max-width: 620px; margin: 0 auto; }

  header {
    position: sticky; top: 0; z-index: 5; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  header .wrap { display: flex; align-items: center; gap: 10px; }
  .brand { font-weight: 700; letter-spacing: -0.02em; cursor: pointer; }
  .node { font-size: 12px; color: var(--muted); margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node::before { content: "●"; color: var(--recast); margin-right: 4px; }
  .search { width: 130px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--alt); font-size: 14px; }
  .me img { width: 30px; height: 30px; border-radius: 50%; display: block; object-fit: cover; background: var(--alt); }

  .compose { padding: 14px 16px; border-bottom: 8px solid var(--alt); }
  .compose textarea {
    width: 100%; min-height: 72px; resize: vertical; border: 0; outline: 0; background: transparent; font-size: 17px;
  }
  .compose .row { display: flex; align-items: center; gap: 10px; }
  .replying { font-size: 14px; color: var(--muted); margin-bottom: 6px; display: none; }
  .replying button { border: 0; background: none; color: var(--accent); padding: 0 4px; cursor: pointer; }
  .count { margin-left: auto; font-size: 13px; color: var(--muted); }
  .count.over { color: var(--bad); }
  .btn { border: 0; border-radius: 999px; padding: 8px 18px; font-weight: 600; background: var(--accent); color: #fff; cursor: pointer; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.ghost { background: var(--alt); color: var(--fg); }

  .filters { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 14px;
    cursor: pointer; white-space: nowrap;
  }
  .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .chip.hide { text-decoration: line-through; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); padding: 8px 16px 0; }

  .cast { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .cast > * { min-width: 0; }
  .pfp { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--alt); cursor: pointer; }
  .meta { font-size: 15px; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; }
  .meta .name { font-weight: 600; cursor: pointer; }
  .meta .user, .meta .time { color: var(--muted); }
  .via { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; cursor: pointer; }
  .context { font-size: 13px; color: var(--muted); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .text.clamp { max-height: 8.7em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
  .more { border: 0; background: none; color: var(--accent); padding: 2px 0; cursor: pointer; font-size: 14px; }
  .embeds img { max-width: 100%; max-height: 420px; border-radius: 12px; margin-top: 8px; display: block; border: 1px solid var(--line); }
  .embeds a.link { display: block; font-size: 14px; margin-top: 6px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 4px; margin: 6px 0 -6px -10px; }
  .actions button { border: 0; background: none; color: var(--muted); padding: 6px 10px; border-radius: 999px; cursor: pointer; font-size: 14px; }
  .actions button:hover { background: var(--alt); }
  .actions .liked { color: var(--like); }
  .actions .recasted { color: var(--recast); }
  .actions .del { margin-left: auto; }

  .profile { padding: 18px 16px; border-bottom: 8px solid var(--alt); display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; }
  .profile img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--alt); }
  .profile h2 { font-size: 20px; margin: 0; }
  .profile .user { color: var(--muted); }
  .apps { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }

  .empty, .loading { padding: 40px 16px; text-align: center; color: var(--muted); }
  .login { max-width: 400px; margin: 12vh auto 40px; padding: 0 16px; }
  .login h1 { letter-spacing: -0.02em; }
  .login input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--alt); margin: 8px 0 12px; }
  .login .btn { width: 100%; padding: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .btn.small { padding: 6px 14px; font-size: 14px; }
  .login .or { text-align: center; color: var(--muted); font-size: 13px; margin: 28px 0 10px; }
  .login .look, .login .nodeform { display: flex; gap: 8px; }
  .login .look input, .login .nodeform input { margin: 0; flex: 1; min-width: 0; }
  .login .look .btn, .login .nodeform .btn { width: auto; }
  .login details { margin-top: 22px; font-size: 14px; color: var(--muted); }
  .login summary { cursor: pointer; margin-bottom: 8px; }
  .hint.readonly { padding: 14px 16px; border-bottom: 8px solid var(--alt); }
  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10;
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px);
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.bad { background: var(--bad); color: #fff; }
  @media (max-width: 420px) { .search { width: 100px; } .node { display: none; } .brand { margin-right: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $app = document.getElementById('app');
const MAX = 320;
let me = null;
let filter = { only: 0, hide: 0 };
let replyTo = null;

// --- helpers -------------------------------------------------------------

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}

let toastTimer;
function toast(msg, bad = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = 'toast'), bad ? 5000 : 2200);
}

// On the tutorial site (live/live.mjs) there's no server: window.FC_LIVE answers
// the same calls straight from a node, in the browser.
const LIVE = window.FC_LIVE;

async function api(path, body) {
  if (LIVE) {
    try {
      return await LIVE.api(path, body);
    } catch (err) {
      if (err.status === 401) showLogin();
      throw err;
    }
  }
  const res = await fetch(path, body
    ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }
    : {});
  const data = await res.json().catch(() => ({ error: 'Bad response from the server.' }));
  if (res.status === 401 && path !== '/api/login') { showLogin(); throw new Error('Log in first.'); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// Farcaster time is seconds since 2021-01-01 UTC.
const FC_EPOCH = Date.UTC(2021, 0, 1);
function ago(ts) {
  const s = (Date.now() - (FC_EPOCH + ts * 1000)) / 1000;
  if (s < 0) return 'now';
  if (s < 60) return Math.floor(s) + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

// Links and @mentions become tappable; everything else stays plain text.
function richText(text) {
  const out = [];
  const re = /(https?:\/\/[^\s]+)|(^|[\s(])@([a-z0-9][a-z0-9.-]*[a-z0-9])/gi;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m[1]) {
      out.push(text.slice(last, m.index), h('a', { href: m[1], target: '_blank', rel: 'noopener noreferrer' }, m[1]));
    } else {
      out.push(text.slice(last, m.index) + m[2], h('a', { href: '#/u/' + m[3] }, '@' + m[3]));
    }
    last = re.lastIndex;
  }
  out.push(text.slice(last));
  return out;
}

const isImage = (url) => /\.(png|jpe?g|gif|webp)(\?|$)/i.test(url) || /imagedelivery\.net|i\.imgur\.com/.test(url);
const bytes = (s) => new TextEncoder().encode(s).length;
const pfp = (p, cls = 'pfp') => h('img', { class: cls, src: p.pfp || 'data:,', alt: '', loading: 'lazy', referrerpolicy: 'no-referrer', onclick: () => go('#/u/' + p.username) });

// --- views ---------------------------------------------------------------

function showLogin() {
  if (LIVE) return $app.replaceChildren(LIVE.loginView(start, h, toast));
  $app.replaceChildren(h('form', { class: 'login', onsubmit: async (e) => {
    e.preventDefault();
    try {
      await api('/api/login', { password: e.target.password.value });
      start();
    } catch (err) { toast(err.message, true); }
  } },
    h('h1', {}, 'farcaster-in-3'),
    h('p', { style: 'color:var(--muted)' }, 'Enter the password printed by fc serve.'),
    h('input', { name: 'password', type: 'password', autocomplete: 'current-password', autofocus: true, placeholder: 'Password' }),
    h('button', { class: 'btn' }, 'Log in')));
}

function header() {
  return h('header', {}, h('div', { class: 'wrap' },
    h('span', { class: 'brand', onclick: () => go('#/') }, 'farcaster-in-3'),
    h('span', { class: 'node', title: 'All reads and writes go through this node' }, me.node),
    h('form', { onsubmit: (e) => { e.preventDefault(); const u = e.target.u.value.trim().replace(/^@/, ''); if (u) go('#/u/' + u); } },
      h('input', { class: 'search', name: 'u', placeholder: 'Go to @user', autocapitalize: 'none', autocorrect: 'off' })),
    me.readOnly
      ? h('button', { class: 'btn small', onclick: () => { LIVE.signOut(); showLogin(); } }, 'Connect')
      : h('a', { class: 'me', href: '#/u/' + me.username, title: '@' + me.username }, h('img', { src: me.pfp || 'data:,', alt: '' }))));
}

// On someone else's profile the composer stays hidden until you tap Reply.
function composer(onPosted, { hiddenUntilReply = false } = {}) {
  const ta = h('textarea', { placeholder: "What's happening?", maxlength: 1000 });
  const count = h('span', { class: 'count' }, String(MAX));
  const send = h('button', { class: 'btn', disabled: true }, 'Cast');
  const replying = h('div', { class: 'replying' });
  const update = () => {
    const left = MAX - bytes(ta.value);
    count.textContent = left;
    count.className = 'count' + (left < 0 ? ' over' : '');
    send.disabled = !ta.value.trim() || left < 0;
  };
  ta.addEventListener('input', update);
  const setReply = (cast) => {
    replyTo = cast;
    replying.style.display = cast ? 'block' : 'none';
    if (hiddenUntilReply) el.style.display = cast ? '' : 'none';
    replying.replaceChildren(...(cast ? ['Replying to @' + cast.author.username, h('button', { onclick: () => setReply(null) }, '✕')] : []));
    if (cast) { ta.focus(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  };
  send.addEventListener('click', async () => {
    send.disabled = true;
    try {
      await api('/api/cast', { text: ta.value, reply: replyTo?.id });
      ta.value = '';
      setReply(null);
      toast('Cast sent through your node');
      onPosted?.();
    } catch (err) { toast(err.message, true); }
    update();
  });
  const el = h('div', { class: 'compose' }, replying, ta, h('div', { class: 'row' }, count, send));
  if (hiddenUntilReply) el.style.display = 'none';
  return { el, setReply };
}

// Long casts fold to six lines until tapped.
function longText(text) {
  const el = h('div', { class: 'text' }, richText(text));
  if (text.length < 360 && text.split('\n').length < 7) return el;
  el.classList.add('clamp');
  const more = h('button', { class: 'more', onclick: () => { el.classList.remove('clamp'); more.remove(); } }, 'Show more');
  return h('div', {}, el, more);
}

function castView(c, { onReply, onChange }) {
  const like = h('button', { class: c.liked ? 'liked' : '' }, c.liked ? '♥ Liked' : '♡ Like');
  const recast = h('button', { class: c.recasted ? 'recasted' : '' }, c.recasted ? '↻ Recasted' : '↻ Recast');
  const toggle = (kind, btn) => async () => {
    const on = !c[kind === 'like' ? 'liked' : 'recasted'];
    btn.disabled = true;
    try {
      await api('/api/react', { id: c.id, kind, on });
      c[kind === 'like' ? 'liked' : 'recasted'] = on;
      if (kind === 'like') { like.className = on ? 'liked' : ''; like.textContent = on ? '♥ Liked' : '♡ Like'; }
      else { recast.className = on ? 'recasted' : ''; recast.textContent = on ? '↻ Recasted' : '↻ Recast'; }
    } catch (err) { toast(err.message, true); }
    btn.disabled = false;
  };
  like.addEventListener('click', toggle('like', like));
  recast.addEventListener('click', toggle('recast', recast));

  const via = c.app && h('span', { class: 'via', title: 'The app that signed this cast. Tap to filter.', onclick: () => {
    filter = filter.only === c.app.fid ? { only: 0, hide: c.app.fid } : filter.hide === c.app.fid ? { only: 0, hide: 0 } : { only: c.app.fid, hide: 0 };
    go('#/');
    toast(filter.only ? 'Only casts from @' + c.app.username : filter.hide ? 'Hiding casts from @' + c.app.username : 'Showing all apps');
  } }, 'via @' + c.app.username);

  return h('article', { class: 'cast' },
    pfp(c.author),
    h('div', {},
      h('div', { class: 'meta' },
        h('span', { class: 'name', onclick: () => go('#/u/' + c.author.username) }, c.author.displayName || c.author.username),
        h('span', { class: 'user' }, '@' + c.author.username),
        h('span', { class: 'time' }, '· ' + ago(c.ts)),
        via),
      c.parent && h('div', { class: 'context' }, '↳ replying to ', h('a', { href: '#/u/' + c.parent.username }, '@' + c.parent.username)),
      c.text && longText(c.text),
      c.embeds.length > 0 && h('div', { class: 'embeds' }, c.embeds.map((e) =>
        e.url ? (isImage(e.url) ? h('img', { src: e.url, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }) : h('a', { class: 'link', href: e.url, target: '_blank', rel: 'noopener noreferrer' }, e.url))
          : h('div', { class: 'context' }, 'quotes cast ' + e.cast.slice(0, 18) + '…'))),
      !me.readOnly && h('div', { class: 'actions' },
        h('button', { onclick: () => onReply(c) }, '↩ Reply'),
        recast, like,
        c.mine && h('button', { class: 'del', onclick: async (e) => {
          if (e.target.dataset.sure !== '1') { e.target.dataset.sure = '1'; e.target.textContent = 'Tap to confirm'; return; }
          try { await api('/api/delete', { id: c.id }); toast('Deleted'); onChange?.(); } catch (err) { toast(err.message, true); }
        } }, 'Delete'))));
}

function appChips(apps, onPick) {
  const chips = [h('button', { class: 'chip' + (!filter.only && !filter.hide ? ' on' : ''), onclick: () => onPick({ only: 0, hide: 0 }) }, 'All apps')];
  for (const a of apps) {
    const on = filter.only === a.fid, hidden = filter.hide === a.fid;
    chips.push(h('button', {
      class: 'chip' + (on ? ' on' : '') + (hidden ? ' hide' : ''),
      title: 'Tap: only this app. Tap again: hide it. Again: show all.',
      onclick: () => onPick(on ? { only: 0, hide: a.fid } : hidden ? { only: 0, hide: 0 } : { only: a.fid, hide: 0 }),
    }, '@' + a.username + ' ' + a.casts));
  }
  return h('div', { class: 'filters' }, chips);
}

async function feedView() {
  const list = h('div', {}, h('div', { class: 'loading' }, 'Reading your feed from your node…'));
  const comp = composer(() => setTimeout(load, 1500));
  const chipsSlot = h('div');
  $app.replaceChildren(header(), h('main', { class: 'wrap' },
    me.readOnly ? h('div', { class: 'hint readonly' }, 'Reading @' + me.username + "'s feed straight from the node. Connect a wallet to post.") : comp.el,
    chipsSlot, list));

  async function load() {
    try {
      const q = new URLSearchParams({ only: filter.only, hide: filter.hide });
      const data = await api('/api/feed?' + q);
      chipsSlot.replaceChildren(
        appChips(data.apps, (f) => { filter = f; load(); }),
        h('div', { class: 'hint' }, filter.only || filter.hide
          ? 'Filtered by the app that signed each cast.'
          : 'Every cast is signed by an app key. Tap an app to see only its casts, again to hide them.'));
      list.replaceChildren(...(data.casts.length
        ? data.casts.map((c) => castView(c, { onReply: comp.setReply, onChange: load }))
        : [h('div', { class: 'empty' }, data.following ? 'No casts left after the app filter.' : "You don't follow anyone yet. Search for someone above and follow them.")]));
    } catch (err) {
      list.replaceChildren(h('div', { class: 'empty' }, err.message));
    }
  }
  await load();
}

async function userView(name) {
  const list = h('div', {}, h('div', { class: 'loading' }, 'Loading @' + name + '…'));
  let comp;
  $app.replaceChildren(header(), h('main', { class: 'wrap' }, list));
  try {
    const u = await api('/api/user?u=' + encodeURIComponent(name));
    const followBtn = !u.self && !me.readOnly && h('button', { class: 'btn' + (u.following ? ' ghost' : '') }, u.following ? 'Following' : 'Follow');
    followBtn && followBtn.addEventListener('click', async () => {
      followBtn.disabled = true;
      try {
        await api('/api/follow', { fid: u.fid, on: !u.following });
        u.following = !u.following;
        followBtn.textContent = u.following ? 'Following' : 'Follow';
        followBtn.className = 'btn' + (u.following ? ' ghost' : '');
        toast(u.following ? 'Following @' + u.username : 'Unfollowed @' + u.username);
      } catch (err) { toast(err.message, true); }
      followBtn.disabled = false;
    });
    comp = composer(() => setTimeout(() => userView(name), 1500), { hiddenUntilReply: !u.self });
    list.replaceChildren(
      h('section', { class: 'profile' },
        h('img', { src: u.pfp || 'data:,', alt: '' }),
        h('div', {}, h('h2', {}, u.displayName || u.username), h('div', { class: 'user' }, '@' + u.username + ' · FID ' + u.fid)),
        followBtn || h('span'),
        u.apps.length > 0 && h('div', { class: 'apps' }, 'Posts from: ' + u.apps.map((a) => '@' + a.username + ' (' + a.casts + ')').join(', ')),
        LIVE && u.self && h('div', { class: 'apps' }, h('button', { class: 'more', onclick: async (e) => {
          if (e.target.dataset.sure !== '1') { e.target.dataset.sure = '1'; e.target.textContent = 'Your wallet will sign the removal. Tap again'; return; }
          try { await api('/api/revoke', {}); toast('Key removed from your account'); showLogin(); } catch (err) { toast(err.message, true); }
        } }, "Remove this browser's key"))),
      comp.el,
      ...(u.casts.length ? u.casts.map((c) => castView(c, { onReply: comp.setReply, onChange: () => userView(name) })) : [h('div', { class: 'empty' }, 'No casts yet.')]));
  } catch (err) {
    list.replaceChildren(h('div', { class: 'empty' }, err.message));
  }
}

// --- routing -------------------------------------------------------------

function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  const m = /^#\/u\/(.+)$/.exec(location.hash);
  if (m) return userView(decodeURIComponent(m[1]));
  return feedView();
}

async function start() {
  try {
    me = await api('/api/me');
  } catch { return; }
  if (!start.listening) window.addEventListener('hashchange', route);
  start.listening = true;
  route();
}

// A QR code from `fc serve --lan` carries the password after #, which never
// reaches the server in a URL. Log in with it, then drop it from the address bar.
(async () => {
  const fromQr = !LIVE && location.hash.length > 1 && !location.hash.startsWith('#/') ? decodeURIComponent(location.hash.slice(1)) : '';
  if (fromQr) {
    history.replaceState(null, '', location.pathname);
    try { await api('/api/login', { password: fromQr }); } catch (err) { toast(err.message, true); }
  }
  start();
})();
</script>
</body>
</html>
