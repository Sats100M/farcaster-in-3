<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>farcaster-in-3</title>
<style>
  :root {
    --bg: #fff; --fg: #111; --muted: #6b6b6b; --faint: #a3a3a3; --line: #e6e6e6; --hover: #f6f6f6;
    --link: #0066cc; --like: #d0103a; --recast: #12804a; --bad: #c62828;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a0a0a; --fg: #ededed; --muted: #8f8f8f; --faint: #5a5a5a; --line: #232323; --hover: #141414; --link: #5aa2ff; --like: #ff4d6d; --recast: #3ccf7f; --bad: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .wrap { max-width: 620px; margin: 0 auto; }
  @media (min-width: 660px) { main.wrap { border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-height: calc(100vh - 49px); } }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  header .in { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; }
  .brand { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--fg); }
  .brand:hover { text-decoration: none; }
  .node { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .node .ok { color: var(--recast); } .node .warn { color: #b7791f; }
  header form { display: flex; }
  .input { height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); outline: none; min-width: 0; }
  .input:focus { border-color: var(--fg); }
  header .input { width: 150px; font-size: 13px; }
  .me img { width: 26px; height: 26px; border-radius: 50%; display: block; object-fit: cover; background: var(--line); }

  .btn { height: 32px; padding: 0 12px; border: 1px solid var(--fg); border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.alt { background: var(--bg); color: var(--fg); border-color: var(--line); }
  .btn.alt:hover { border-color: var(--fg); }

  .note { padding: 12px 16px; font-size: 13.5px; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
  .note .btn { margin-left: auto; }

  .compose { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .compose textarea { display: block; width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--bg); outline: none; font-size: 15px; }
  .compose textarea:focus { border-color: var(--fg); }
  .compose .row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .compose .count { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; }
  .compose .count.over { color: var(--bad); }
  .replying { display: none; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .replying button { border: 0; background: none; color: var(--link); padding: 0 0 0 6px; font-size: 13px; }

  .filters { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; align-items: baseline; }
  .filters .label { color: var(--muted); }
  .filters button { border: 0; background: none; padding: 0; color: var(--muted); }
  .filters button:hover { color: var(--fg); }
  .filters button.on { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
  .filters button.hide { color: var(--faint); text-decoration: line-through; }
  .filters .help { flex-basis: 100%; color: var(--faint); font-size: 11.5px; }

  .cast { display: grid; grid-template-columns: 36px 1fr; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .cast > * { min-width: 0; }
  .pfp { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--line); cursor: pointer; display: block; }
  .head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .head .name { font-weight: 600; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .name:hover { text-decoration: underline; }
  .head .user { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .head .time { color: var(--muted); white-space: nowrap; }
  .head .via { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); border: 0; background: none; padding: 0; white-space: nowrap; }
  .head .via:hover { color: var(--fg); text-decoration: underline; }
  .ctx { font-size: 12.5px; color: var(--muted); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .text.clamp { max-height: 9em; overflow: hidden; }
  .more { border: 0; background: none; color: var(--link); padding: 0; font-size: 13px; }
  .embeds img { max-width: 100%; max-height: 380px; border-radius: 6px; margin-top: 8px; display: block; border: 1px solid var(--line); }
  .embeds .url { display: block; margin-top: 4px; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .embeds .url span { color: var(--muted); }
  .actions { display: flex; gap: 16px; margin-top: 6px; font-family: var(--mono); font-size: 12px; }
  .actions button { border: 0; background: none; padding: 2px 0; color: var(--muted); }
  .actions button:hover { color: var(--fg); }
  .actions .like.on { color: var(--like); }
  .actions .recast.on { color: var(--recast); }
  .actions .del.sure { color: var(--bad); }
  .actions .id { margin-left: auto; color: var(--faint); cursor: pointer; padding: 2px 0; }

  .profile { padding: 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; }
  .profile img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--line); }
  .profile h2 { margin: 0; font-size: 18px; line-height: 1.25; }
  .profile .sub { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .profile .meta { grid-column: 1 / -1; font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .profile .meta:empty { display: none; }
  .profile .meta button { border: 0; background: none; padding: 0; color: var(--link); font: inherit; }
  .profile .meta button.sure { color: var(--bad); }

  .state { padding: 28px 16px; color: var(--muted); font-size: 14px; }
  .state.mono { font-family: var(--mono); font-size: 12.5px; }

  .gate { max-width: 460px; margin: 0 auto; padding: 12vh 20px 40px; }
  .gate h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .gate p { margin: 0 0 16px; color: var(--muted); }
  .gate .node { display: block; margin: 0 0 20px; }
  .gate .row { display: flex; gap: 8px; }
  .gate .row .input { flex: 1; height: 36px; }
  .gate .row .btn, .gate .wide { height: 36px; }
  .gate .wide { width: 100%; }
  .gate .small { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .gate .try { font-family: var(--mono); font-size: 12.5px; margin-top: 10px; color: var(--muted); }
  .gate .try button { border: 0; background: none; padding: 0; color: var(--link); font: inherit; margin-left: 10px; }
  .gate hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
  .gate h2 { font-size: 12.5px; font-family: var(--mono); font-weight: 600; margin: 0 0 8px; }
  .gate .status { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 8px; }
  .gate .status:empty { display: none; }
  .gate details { font-size: 13px; color: var(--muted); }
  .gate summary { cursor: pointer; font-family: var(--mono); font-size: 12.5px; }
  .gate details .row { margin-top: 8px; }
  .gate .foot { font-family: var(--mono); font-size: 12px; margin-top: 28px; display: flex; gap: 16px; }

  .toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10; background: var(--fg); color: var(--bg); padding: 8px 12px; border-radius: 6px; font-size: 13px; max-width: calc(100% - 32px); opacity: 0; transition: opacity 0.15s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.bad { background: var(--bad); color: #fff; }

  @media (max-width: 480px) { header .input { width: 120px; } .node { display: none; } .brand { margin-right: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $app = document.getElementById('app');
const MAX = 320;
let me = null;
let filter = { only: 0, hide: 0 };
let replyTo = null;

// --- helpers -------------------------------------------------------------

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}

let toastTimer;
function toast(msg, bad = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = 'toast'), bad ? 5000 : 2000);
}

// On the tutorial site (live/live.mjs) there's no server: window.FC_LIVE answers
// the same calls straight from a node, in the browser.
const LIVE = window.FC_LIVE;

async function api(path, body) {
  if (LIVE) {
    try {
      return await LIVE.api(path, body);
    } catch (err) {
      if (err.status === 401) showLogin();
      throw err;
    }
  }
  const res = await fetch(path, body
    ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }
    : {});
  const data = await res.json().catch(() => ({ error: 'Bad response from the server.' }));
  if (res.status === 401 && path !== '/api/login') { showLogin(); throw new Error('Log in first.'); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// Farcaster time is seconds since 2021-01-01 UTC.
const FC_EPOCH = Date.UTC(2021, 0, 1);
function ago(ts) {
  const s = (Date.now() - (FC_EPOCH + ts * 1000)) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 7 * 86400) return Math.floor(s / 86400) + 'd';
  return new Date(FC_EPOCH + ts * 1000).toISOString().slice(0, 10);
}

// Links and @mentions become tappable; everything else stays plain text.
function richText(text) {
  const out = [];
  const re = /(https?:\/\/[^\s]+)|(^|[\s(])@([a-z0-9][a-z0-9.-]*[a-z0-9])/gi;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m[1]) out.push(text.slice(last, m.index), h('a', { href: m[1], target: '_blank', rel: 'noopener noreferrer' }, m[1]));
    else out.push(text.slice(last, m.index) + m[2], h('a', { href: '#/u/' + m[3] }, '@' + m[3]));
    last = re.lastIndex;
  }
  out.push(text.slice(last));
  return out;
}

const isImage = (url) => /\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(url) || /imagedelivery\.net|i\.imgur\.com/.test(url);
const bytes = (s) => new TextEncoder().encode(s).length;
const avatar = (p, cls) => h('img', { class: cls, src: p.pfp || 'data:,', alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
const state = (text, mono = false) => h('div', { class: 'state' + (mono ? ' mono' : '') }, text);

// --- views ---------------------------------------------------------------

function showLogin() {
  if (LIVE) return $app.replaceChildren(LIVE.loginView(start, { h, toast }));
  $app.replaceChildren(h('form', { class: 'gate', onsubmit: async (e) => {
    e.preventDefault();
    try {
      await api('/api/login', { password: e.target.password.value });
      start();
    } catch (err) { toast(err.message, true); }
  } },
    h('h1', {}, 'farcaster-in-3'),
    h('p', {}, 'Password printed by fc serve.'),
    h('div', { class: 'row' },
      h('input', { class: 'input', name: 'password', type: 'password', autocomplete: 'current-password', autofocus: true }),
      h('button', { class: 'btn' }, 'Log in'))));
}

function header() {
  const node = h('span', { class: 'node', title: 'Every read and write goes through this node' }, 'node ' + me.node);
  api('/api/node').then((n) => {
    node.replaceChildren('node ' + n.host + ' · ', h('span', { class: n.behind < 30 ? 'ok' : 'warn' }, n.behind < 30 ? 'in sync' : `${n.behind}s behind`));
  }, () => {});
  return h('header', {}, h('div', { class: 'wrap' }, h('div', { class: 'in' },
    h('a', { class: 'brand', href: '#/' }, 'farcaster-in-3'),
    node,
    h('form', { onsubmit: (e) => { e.preventDefault(); const u = e.target.u.value.trim().replace(/^@/, ''); if (u) go('#/u/' + u); } },
      h('input', { class: 'input', name: 'u', placeholder: 'username or fid', autocapitalize: 'none', autocorrect: 'off', enterkeyhint: 'go' })),
    !me.readOnly && h('a', { class: 'me', href: '#/u/' + me.username, title: '@' + me.username }, avatar(me, '')))));
}

// On someone else's profile the composer stays hidden until you tap reply.
function composer(onPosted, { hiddenUntilReply = false } = {}) {
  const ta = h('textarea', { placeholder: 'Cast something', maxlength: 1000 });
  const count = h('span', { class: 'count' }, `0/${MAX} bytes`);
  const send = h('button', { class: 'btn', disabled: true }, 'Cast');
  const replying = h('div', { class: 'replying' });
  const update = () => {
    const used = bytes(ta.value);
    count.textContent = `${used}/${MAX} bytes`;
    count.className = 'count' + (used > MAX ? ' over' : '');
    send.disabled = !ta.value.trim() || used > MAX;
  };
  ta.addEventListener('input', update);
  const setReply = (cast) => {
    replyTo = cast;
    replying.style.display = cast ? 'block' : 'none';
    if (hiddenUntilReply) el.style.display = cast ? '' : 'none';
    send.textContent = cast ? 'Reply' : 'Cast';
    replying.replaceChildren(...(cast ? ['Replying to @' + cast.author.username, h('button', { onclick: () => setReply(null) }, 'cancel')] : []));
    if (cast) { el.scrollIntoView({ block: 'center' }); ta.focus(); }
  };
  send.addEventListener('click', async () => {
    send.disabled = true;
    try {
      await api('/api/cast', { text: ta.value, reply: replyTo?.id });
      ta.value = '';
      setReply(null);
      toast('Sent to the node');
      onPosted?.();
    } catch (err) { toast(err.message, true); }
    update();
  });
  const el = h('div', { class: 'compose' }, replying, ta, h('div', { class: 'row' }, count, send));
  if (hiddenUntilReply) el.style.display = 'none';
  return { el, setReply };
}

// Long casts fold until tapped.
function longText(text) {
  const el = h('div', { class: 'text' }, richText(text));
  if (text.length < 360 && text.split('\n').length < 7) return el;
  el.classList.add('clamp');
  const more = h('button', { class: 'more', onclick: () => { el.classList.remove('clamp'); more.remove(); } }, 'more');
  return h('div', {}, el, more);
}

function embedView(e) {
  if (e.cast) return h('div', { class: 'url' }, h('span', {}, 'quote '), e.cast.slice(0, 20) + '…');
  if (isImage(e.url)) return h('a', { href: e.url, target: '_blank', rel: 'noopener noreferrer' }, h('img', { src: e.url, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }));
  const kind = /\.m3u8(\?|$)|\/video\//.test(e.url) ? 'video ' : '';
  return h('a', { class: 'url', href: e.url, target: '_blank', rel: 'noopener noreferrer' }, kind && h('span', {}, kind), e.url.replace(/^https?:\/\//, ''));
}

function castView(c, { onReply, onChange }) {
  const toggle = (kind) => {
    const key = kind === 'like' ? 'liked' : 'recasted';
    const word = () => (kind === 'like' ? (c.liked ? 'liked' : 'like') : (c.recasted ? 'recasted' : 'recast'));
    const b = h('button', { class: kind + (c[key] ? ' on' : '') }, word());
    b.addEventListener('click', async () => {
      const on = !c[key];
      c[key] = on;
      b.className = kind + (on ? ' on' : '');
      b.textContent = word();
      try {
        await api('/api/react', { id: c.id, kind, on });
      } catch (err) {
        c[key] = !on;
        b.className = kind + (!on ? ' on' : '');
        b.textContent = word();
        toast(err.message, true);
      }
    });
    return b;
  };
  const del = c.mine && h('button', { class: 'del' }, 'delete');
  del && del.addEventListener('click', async () => {
    if (!del.classList.contains('sure')) { del.classList.add('sure'); del.textContent = 'confirm delete'; return; }
    try { await api('/api/delete', { id: c.id }); toast('Deleted'); onChange?.(); } catch (err) { toast(err.message, true); }
  });
  const id = h('span', { class: 'id', title: 'Cast id (fid/hash). Click to copy.', onclick: () => navigator.clipboard?.writeText(c.id).then(() => toast('Copied ' + c.id)) }, c.id.slice(0, c.id.indexOf('/') + 9));

  const via = c.app && h('button', { class: 'via', title: 'The app whose key signed this cast. Click to filter by it.', onclick: () => {
    filter = filter.only === c.app.fid ? { only: 0, hide: c.app.fid } : filter.hide === c.app.fid ? { only: 0, hide: 0 } : { only: c.app.fid, hide: 0 };
    go('#/');
  } }, 'via ' + c.app.username);

  const pic = avatar(c.author, 'pfp');
  pic.addEventListener('click', () => go('#/u/' + c.author.username));
  return h('article', { class: 'cast' },
    pic,
    h('div', {},
      c.parent && h('div', { class: 'ctx' }, 'reply to ', h('a', { href: '#/u/' + c.parent.username }, '@' + c.parent.username)),
      h('div', { class: 'head' },
        h('span', { class: 'name', onclick: () => go('#/u/' + c.author.username) }, c.author.displayName || c.author.username),
        h('span', { class: 'user' }, '@' + c.author.username),
        h('span', { class: 'time' }, ago(c.ts)),
        via),
      c.text && longText(c.text),
      c.embeds.length > 0 && h('div', { class: 'embeds' }, c.embeds.map(embedView)),
      h('div', { class: 'actions' },
        !me.readOnly && [h('button', { onclick: () => onReply(c) }, 'reply'), toggle('recast'), toggle('like')],
        del, id)));
}

function appFilter(apps, onPick) {
  const items = [h('span', { class: 'label' }, 'apps:'),
    h('button', { class: !filter.only && !filter.hide ? 'on' : '', onclick: () => onPick({ only: 0, hide: 0 }) }, 'all')];
  for (const a of apps) {
    const on = filter.only === a.fid, hidden = filter.hide === a.fid;
    items.push(h('button', {
      class: on ? 'on' : hidden ? 'hide' : '',
      title: 'Click: only this app. Again: hide it. Again: all.',
      onclick: () => onPick(on ? { only: 0, hide: a.fid } : hidden ? { only: 0, hide: 0 } : { only: a.fid, hide: 0 }),
    }, `${a.username} ${a.casts}`));
  }
  items.push(h('span', { class: 'help' }, 'Every cast is signed by an app key that names the app. Click once for only that app, twice to hide it.'));
  return h('div', { class: 'filters' }, items);
}

async function feedView() {
  const list = h('div', {}, state('Reading the feed from the node…', true));
  const comp = composer(() => setTimeout(load, 1500));
  const filters = h('div');
  const top = me.readOnly
    ? h('div', { class: 'note' }, h('span', {}, 'Read-only: the feed of @' + me.username + '.'), h('button', { class: 'btn alt', onclick: () => { LIVE.signOut(); showLogin(); } }, 'Sign in to post'))
    : comp.el;
  $app.replaceChildren(header(), h('main', { class: 'wrap' }, top, filters, list));

  async function load() {
    try {
      const data = await api('/api/feed?' + new URLSearchParams({ only: filter.only, hide: filter.hide }));
      filters.replaceChildren(appFilter(data.apps, (f) => { filter = f; list.replaceChildren(state('Filtering…', true)); load(); }));
      list.replaceChildren(...(data.casts.length
        ? data.casts.map((c) => castView(c, { onReply: comp.setReply, onChange: load }))
        : [state(data.following ? 'No recent casts left after the app filter.' : 'Not following anyone yet. Look someone up above and follow them.')]));
    } catch (err) {
      list.replaceChildren(state("Couldn't read from the node: " + err.message));
    }
  }
  await load();
}

async function userView(name) {
  const body = h('div', {}, state('Loading @' + name + '…', true));
  $app.replaceChildren(header(), h('main', { class: 'wrap' }, body));
  try {
    const u = await api('/api/user?u=' + encodeURIComponent(name));
    const followBtn = !u.self && !me.readOnly && h('button', { class: u.following ? 'btn alt' : 'btn' }, u.following ? 'Unfollow' : 'Follow');
    followBtn && followBtn.addEventListener('click', async () => {
      followBtn.disabled = true;
      try {
        await api('/api/follow', { fid: u.fid, on: !u.following });
        u.following = !u.following;
        followBtn.textContent = u.following ? 'Unfollow' : 'Follow';
        followBtn.className = u.following ? 'btn alt' : 'btn';
        toast(u.following ? 'Following @' + u.username : 'Unfollowed @' + u.username);
      } catch (err) { toast(err.message, true); }
      followBtn.disabled = false;
    });
    const revoke = LIVE && u.self && h('button', {}, "remove this browser's key");
    revoke && revoke.addEventListener('click', async () => {
      if (!revoke.classList.contains('sure')) { revoke.classList.add('sure'); revoke.textContent = 'confirm: your wallet signs the removal'; return; }
      try { await api('/api/revoke', {}); toast('Key removed'); showLogin(); } catch (err) { toast(err.message, true); }
    });
    const comp = composer(() => setTimeout(() => userView(name), 1500), { hiddenUntilReply: !u.self });
    body.replaceChildren(
      h('section', { class: 'profile' },
        avatar(u, ''),
        h('div', {}, h('h2', {}, u.displayName || u.username), h('div', { class: 'sub' }, '@' + u.username + ' · fid ' + u.fid)),
        followBtn || h('span'),
        h('div', { class: 'meta' },
          u.apps.length > 0 && h('span', {}, 'apps: ' + u.apps.map((a) => `${a.username} ${a.casts}`).join(', ')),
          revoke)),
      comp.el,
      ...(u.casts.length ? u.casts.map((c) => castView(c, { onReply: comp.setReply, onChange: () => userView(name) })) : [state('No casts.')]));
  } catch (err) {
    body.replaceChildren(state(err.message));
  }
}

// --- routing -------------------------------------------------------------

function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  window.scrollTo(0, 0);
  const m = /^#\/u\/(.+)$/.exec(location.hash);
  if (m) return userView(decodeURIComponent(m[1]));
  return feedView();
}

// Anything that goes wrong before the first screen shows here, never as a blank page.
function fatal(title, detail) {
  $app.replaceChildren(h('div', { class: 'gate' },
    h('h1', {}, title),
    h('p', {}, detail),
    h('button', { class: 'btn', onclick: () => location.reload() }, 'Reload')));
}
window.addEventListener('error', (e) => { if (!me && !$app.childElementCount) fatal('Something broke', String(e.message || e)); });
window.addEventListener('unhandledrejection', (e) => { if (!me && !$app.childElementCount) fatal('Something broke', String(e.reason?.message || e.reason)); });

async function start() {
  try {
    me = await api('/api/me');
  } catch (err) {
    if (err.status !== 401 && !/Log in first/.test(err.message)) fatal("Couldn't start", err.message);
    return;
  }
  if (!start.listening) window.addEventListener('hashchange', route);
  start.listening = true;
  route();
}

// A QR code from `fc serve --lan` carries the password after #, which never
// reaches the server in a URL. Log in with it, then drop it from the address bar.
(async () => {
  // On the tutorial site the client code comes from live.js; if it didn't load, say so.
  if (!LIVE && location.hostname.endsWith('github.io')) {
    return fatal("The client didn't load", 'Reload the page. If it stays like this, try a current Chrome, Safari or Firefox.');
  }
  const fromQr = !LIVE && location.hash.length > 1 && !location.hash.startsWith('#/') ? decodeURIComponent(location.hash.slice(1)) : '';
  if (fromQr) {
    history.replaceState(null, '', location.pathname);
    try { await api('/api/login', { password: fromQr }); } catch (err) { toast(err.message, true); }
  }
  start();
})();
</script>
