name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: syntax-check scripts
        run: for f in scripts/*.mjs scripts/providers/*/*.mjs client/fc.mjs; do node --check "$f"; done

      - name: client installs and starts
        working-directory: client
        run: |
          npm ci
          node fc.mjs | grep -q "fc init"

      - name: provision refuses to run without credentials
        run: |
          out=$(node scripts/provision.mjs --provider hetzner 2>&1 || true)
          echo "$out" | grep -q "Missing HCLOUD_TOKEN"
