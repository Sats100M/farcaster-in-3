name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: syntax-check scripts
        run: for f in fc3.mjs scripts/*.mjs scripts/providers/*/*.mjs client/*.mjs client/live/*.mjs; do node --check "$f"; done

      - name: client installs, passes its tests and starts
        working-directory: client
        run: |
          npm ci
          npm test
          node fc.mjs | grep -q "fc init"
          npm run build:live

      - name: fc3 starts and asks for a server first
        run: |
          ./fc3 | grep -q "fc3 provision"
          out=$(./fc3 status 2>&1 || true)
          echo "$out" | grep -q "No server yet"

      - name: provision refuses to run without credentials
        run: |
          out=$(node scripts/provision.mjs --provider hetzner 2>&1 || true)
          echo "$out" | grep -q "Missing HCLOUD_TOKEN"
